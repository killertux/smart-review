name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="smart-review ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/smart-review --version)"
          test "$actual" = "$expected" || {
            echo "tag/binary version mismatch: expected '$expected', got '$actual'"
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf \
            dist/smart-review-${{ matrix.target }}.tar.gz smart-review

      - uses: actions/upload-artifact@v4
        with:
          name: smart-review-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum smart-review-*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
