name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Kache (next step) caches compiled artifacts content-addressed; keep
          # rust-cache only for the registry/git downloads so the two do not
          # store two copies of `target/` under GitHub's cache quota.
          cache-targets: "false"

      - name: Cache compiled artifacts (kache)
        uses: kunobi-ninja/kache-action@v1
        with:
          # PRs restore read-only; only pushes to the default branch publish.
          save-cache: ${{ github.ref_name == github.event.repository.default_branch }}
          # No sticky PR comment; the job summary still reports cache stats.
          pr-comment: "false"
          # rustls pulls in `ring`, which compiles C and assembly through `cc`.
          cache-c-cpp: "true"

      - name: Formatting
        run: cargo fmt --all --check

      # The lint policy lives in Cargo.toml under [workspace.lints]; this turns
      # every warning into a failure so it cannot be ignored (AGENTS.md).
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: |
          started="$(python3 -c 'import time; print(time.monotonic_ns())')"
          cargo test --all-features
          finished="$(python3 -c 'import time; print(time.monotonic_ns())')"
          echo "SMART_REVIEW_RUST_TEST_MS=$(( (finished - started) / 1000000 ))" >>"$GITHUB_ENV"

      - name: Build
        run: cargo build

      - name: Smoke test the binary
        run: |
          ./target/debug/smart-review --version
          ./target/debug/smart-review --help

      # `--check` runs the same detection the interface does, so on a runner with no
      # `gh auth login` it reports an unusable environment and exits 2 — which is the
      # honest answer, not a failure. Assert that a report is produced, that the exit
      # code is one of the three documented ones, and that it names what is missing.
      - name: Environment report
        run: |
          set +e
          SMART_REVIEW_HOME="$(mktemp -d)" ./target/debug/smart-review --check >/tmp/check.txt 2>&1
          code=$?
          set -e
          cat /tmp/check.txt
          echo "exit code: $code"
          case "$code" in
            0|1|2) ;;
            *) echo "unexpected exit code"; exit 1 ;;
          esac
          # Every report names the repository and says what it found.
          grep -q 'repository' /tmp/check.txt
          grep -q 'gh' /tmp/check.txt
          if [ "$code" -ne 0 ]; then
            # A non-zero run has to say what to do about it, not just that it failed.
            grep -qE 'gh auth login|not a git repository|--repo|cli.github.com' /tmp/check.txt
          fi

      # Cargo's deterministic gates already passed above. The aggregate runner checks
      # local documentation links, then executes only the named wiring smoke contracts
      # against temporary repositories, fake services and reconstructed PTY screens.
      - name: Documentation and named wiring smoke
        env:
          SMART_REVIEW_VALIDATION_OUTPUT: ${{ runner.temp }}/smart-review-validation
        run: bash scripts/validate/all.sh --smoke-only

      - name: Upload validator failure captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-validation-captures
          path: ${{ runner.temp }}/smart-review-validation
          if-no-files-found: ignore
          retention-days: 7
