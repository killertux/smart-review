name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # The lint policy lives in Cargo.toml under [workspace.lints]; this turns
      # every warning into a failure so it cannot be ignored (AGENTS.md §7).
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

      - name: Smoke test the binary
        run: |
          ./target/release/smart-review --version
          ./target/release/smart-review --help

      # `--check` exits 1 while no model is configured (DEC-6), which is expected
      # until M2. Assert the report is produced and the exit code is sane.
      - name: Environment report
        run: |
          set +e
          SMART_REVIEW_HOME="$(mktemp -d)" ./target/release/smart-review --check
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 0 -o "$code" -eq 1
