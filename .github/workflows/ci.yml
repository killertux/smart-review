name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          # Kache (next step) caches compiled artifacts content-addressed; keep
          # rust-cache only for the registry/git downloads so the two do not
          # store two copies of `target/` under GitHub's cache quota.
          cache-targets: "false"

      - name: Cache compiled artifacts (kache)
        uses: kunobi-ninja/kache-action@v1
        with:
          # PRs restore read-only; only pushes to the default branch publish.
          save-cache: ${{ github.ref_name == github.event.repository.default_branch }}
          # No sticky PR comment; the job summary still reports cache stats.
          pr-comment: "false"
          # rustls pulls in `ring`, which compiles C and assembly through `cc`.
          cache-c-cpp: "true"

      - name: Formatting
        run: cargo fmt --all --check

      # The lint policy lives in Cargo.toml under [workspace.lints]; this turns
      # every warning into a failure so it cannot be ignored (AGENTS.md §7).
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Build
        run: cargo build

      - name: Smoke test the binary
        run: |
          ./target/debug/smart-review --version
          ./target/debug/smart-review --help

      # `--check` runs the same detection the interface does, so on a runner with no
      # `gh auth login` it reports an unusable environment and exits 2 — which is the
      # honest answer, not a failure. Assert that a report is produced, that the exit
      # code is one of the three documented ones, and that it names what is missing.
      - name: Environment report
        run: |
          set +e
          SMART_REVIEW_HOME="$(mktemp -d)" ./target/debug/smart-review --check >/tmp/check.txt 2>&1
          code=$?
          set -e
          cat /tmp/check.txt
          echo "exit code: $code"
          case "$code" in
            0|1|2) ;;
            *) echo "unexpected exit code"; exit 1 ;;
          esac
          # Every report names the repository and says what it found.
          grep -q 'repository' /tmp/check.txt
          grep -q 'gh' /tmp/check.txt
          if [ "$code" -ne 0 ]; then
            # A non-zero run has to say what to do about it, not just that it failed.
            grep -qE 'gh auth login|not a git repository|--repo|cli.github.com' /tmp/check.txt
          fi

      # The milestones' own gates: formatting, lints, tests, first-run layout,
      # permissions, configuration robustness, and — for M1 — the whole browsing
      # and diff chain driven through a fake `gh`, with the screen reconstructed
      # from the pty capture (the pty steps need GNU `script`).
      - name: Milestone validation (M0)
        run: bash scripts/validate/m0.sh

      - name: Milestone validation (M1)
        run: bash scripts/validate/m1.sh

      # M2a adds a managed worktree, a local diff and the model picker: the validator
      # builds a real repository with a pull request ref, serves the catalog from a
      # local HTTP server, and drives the picker through a pty.
      - name: Milestone validation (M2a)
        run: bash scripts/validate/m2a.sh

      # M2b adds the analysis path: the validator stands in for the provider with a
      # scripted OpenAI-compatible server, so the whole chain — context, request,
      # stream, normalize, cache, ordered review — runs offline, and the request the
      # app actually sent is checked on the wire for what must and must not be in it.
      - name: Milestone validation (M2b)
        run: bash scripts/validate/m2b.sh

      # M3 adds the conversation: the validator stands in for the provider again, this
      # time with a scripted answer that streams, and reads the wire for what a chat
      # request must and must not carry — the bundle in the system prompt, the earlier
      # turns in the history, and a committed `.env` never.
      - name: Milestone validation (M3)
        run: bash scripts/validate/m3.sh

      # M4 adds publishing. The fake `gh` records its argv and keeps a copy of every
      # `--input` payload, so the step that matters asserts on what reached the wire:
      # one review, with the decision and every comment in it, and no per-comment call
      # at all — plus a dry run that reaches nothing.
      - name: Milestone validation (M4)
        run: bash scripts/validate/m4.sh

      # M5 completes the public review loop. Its fake forge asserts reply routes,
      # GraphQL thread mutations, PR-conversation posts, failure preservation and the
      # dry-run ledger; it also runs a non-interactive $EDITOR and checks the generated
      # docs plus the native-release workflow contract.
      - name: Milestone validation (M5)
        run: bash scripts/validate/m5.sh
